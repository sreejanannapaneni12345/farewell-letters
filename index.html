<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Until Our Paths Cross Again</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         FALLING GOLD SPARKLES
    ========================================== -->

    <div id="sparkles"></div>


    <!-- =========================================
         CELEBRATION CONFETTI
    ========================================== -->

    <div id="confetti"></div>


    <!-- =========================================
         MAIN SCENE
    ========================================== -->

    <main class="scene">


        <!-- =====================================
             INTRODUCTION
        ====================================== -->

        <header class="intro">

            <p class="eyebrow">
                🤍
            </p>

            <h1>
                Until Our Paths<br>
                Cross Again
            </h1>

            <p class="subtitle">
                A little expression of gratitude from me
            </p>

            <div class="instruction">
                <span>✦</span>
                Please click on your letter
                <span>✦</span>
            </div>

        </header>


        <!-- =====================================
             OFFICE DESK
        ====================================== -->

        <section class="desk">

            <div class="desk-light"></div>


            <!-- =================================
                 LETTERS
            ================================== -->

            <div class="letters">


                <!-- BEN -->

                <button
                    class="letter"
                    data-person="ben"
                    aria-label="Open Ben's letter">

                    <span class="seal">✦</span>

                    <span class="letter-name">
                        Ben
                    </span>

                    <span class="letter-hint">
                        open letter
                    </span>

                </button>


                <!-- RAFAEL -->

                <button
                    class="letter"
                    data-person="rafael"
                    aria-label="Open Rafa's letter">

                    <span class="seal">✦</span>

                    <span class="letter-name">
                        Rafa
                    </span>

                    <span class="letter-hint">
                        open letter
                    </span>

                </button>


                <!-- SIRISHA -->

                <button
                    class="letter"
                    data-person="sirisha"
                    aria-label="Open Sirisha's letter">

                    <span class="seal">✦</span>

                    <span class="letter-name">
                        Sirisha
                    </span>

                    <span class="letter-hint">
                        open letter
                    </span>

                </button>


                <!-- SHRUTI -->

                <button
                    class="letter"
                    data-person="shruti"
                    aria-label="Open Shruti's letter">

                    <span class="seal">✦</span>

                    <span class="letter-name">
                        Shruti
                    </span>

                    <span class="letter-hint">
                        open letter
                    </span>

                </button>


                <!-- SARAH -->

                <button
                    class="letter"
                    data-person="sarah"
                    aria-label="Open Sarah's letter">

                    <span class="seal">✦</span>

                    <span class="letter-name">
                        Sarah
                    </span>

                    <span class="letter-hint">
                        open letter
                    </span>

                </button>

            </div>


            <!-- =================================
                 COFFEE CUP
            ================================== -->

            <div class="desk-object coffee">

                <div class="coffee-cup"></div>

                <div class="coffee-steam"></div>

            </div>


            <!-- =================================
                 PEN
            ================================== -->

            <div class="desk-object pen"></div>


            <!-- =================================
                 DESK EDGE
            ================================== -->

            <div class="desk-edge"></div>

        </section>

    </main>


    <!-- =========================================
         LETTER MODAL
    ========================================== -->

    <div
        class="letter-modal"
        id="letterModal"
        aria-hidden="true">

        <div class="modal-backdrop"></div>


        <article
            class="opened-letter"
            role="dialog"
            aria-modal="true">


            <!-- CLOSE BUTTON -->

            <button
                class="close-letter"
                id="closeLetter"
                aria-label="Close letter">

                ×

            </button>


            <!-- DECORATION -->

            <div class="paper-decoration">
                ✦
            </div>


            <!-- PERSON -->

            <p
                class="letter-to"
                id="letterTo">
            </p>


            <!-- MESSAGE -->

            <div
                class="message"
                id="letterMessage">
            </div>


            <!-- SIGNATURE -->

            <div class="letter-ending">

                <span>
                    With gratitude,
                </span>

                <strong>
                    Sreeja
                </strong>

            </div>

        </article>

    </div>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>
        Made with <span>LOVE</span> and gratitude
        &nbsp;•&nbsp;
        Sreeja
    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
